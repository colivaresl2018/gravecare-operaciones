<script type="module">
    import { requireStaffAccess } from "./js/portal-common.js";
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAthgIWiVPDuscljVjQRAX-vIeUYLbrSC0",
      authDomain: "gravecare-2e8d2.firebaseapp.com",
      projectId: "gravecare-2e8d2",
      storageBucket: "gravecare-2e8d2.appspot.com",
      messagingSenderId: "160012946248",
      appId: "1:160012946248:web:8c3e73100f1e92c485c17d"
    };

    // Inicialización explícita asegurando que 'db' siempre sea un FirebaseFirestore válido
    const app = getApps().length > 0 ? getApps()[0] : initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let listaTotalTrabajos = [];

    function formatearFecha(f) {
      if (!f) return "-";
      let d = null;
      if (typeof f?.toDate === "function") d = f.toDate();
      else if (f instanceof Date) d = f;
      else if (typeof f === "string") {
        if (/^\d{4}-\d{2}-\d{2}$/.test(f)) {
          const [anio, mes, dia] = f.split('-').map(Number);
          d = new Date(anio, mes - 1, dia);
        } else {
          d = new Date(f);
        }
      }
      if (!d || isNaN(d.getTime())) return f || "-";
      return d.toLocaleDateString("es-CL", { day: "2-digit", month: "2-digit", year: "numeric" });
    }

    function extraerFechaDate(f) {
      if (!f) return null;
      if (typeof f?.toDate === "function") return f.toDate();
      if (f instanceof Date) return f;
      if (typeof f === "string") {
        if (/^\d{4}-\d{2}-\d{2}$/.test(f)) {
          const [anio, mes, dia] = f.split('-').map(Number);
          return new Date(anio, mes - 1, dia);
        }
        const parsed = new Date(f);
        if (!isNaN(parsed.getTime())) return parsed;
      }
      return null;
    }

    function formatearDinero(val) {
      if (val === undefined || val === null || val === "") return "$0";
      const num = Number(val);
      if (isNaN(num)) return `$${val}`;
      return new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 }).format(num);
    }

    function extraerNombreDifunto(obj) {
      if (!obj) return "Ser Querido";
      if (typeof obj === "string" && obj.trim()) return obj.trim();
      if (typeof obj === "object") {
        if (obj.nombreCompleto && obj.nombreCompleto.trim()) return obj.nombreCompleto.trim();
        const nom = (obj.nombre || obj.nombres || "").trim();
        const apePat = (obj.apellidoPaterno || obj.apellido || "").trim();
        const combo = `${nom} ${apePat}`.trim();
        if (combo) return combo;
      }
      return "Ser Querido";
    }

    window.cargarTodosLosTrabajos = async function() {
      const cuerpo = document.getElementById("tabla-cuerpo");
      const badge = document.getElementById("badge-total");
      cuerpo.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-slate-400 font-medium">Consultando registros en Firebase...</td></tr>`;
      badge.textContent = "Sincronizando...";

      try {
        const [snapOrdenes, snapInformes] = await Promise.all([
          getDocs(collection(db, "ordenes")),
          getDocs(collection(db, "informes")).catch(() => ({ docs: [] }))
        ]);

        const ordenesRaw = snapOrdenes.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const informesRaw = snapInformes.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        const mapaInformesPorOrden = new Map();
        informesRaw.forEach(inf => {
          const ordKey = inf.ordenId || inf.numeroOrden || inf.id.replace("informe_", "");
          if (!mapaInformesPorOrden.has(ordKey)) mapaInformesPorOrden.set(ordKey, []);
          mapaInformesPorOrden.get(ordKey).push(inf);
          mapaInformesPorOrden.set(inf.id, [inf]);
        });

        listaTotalTrabajos = ordenesRaw.map(ord => {
          const infsAsociados = mapaInformesPorOrden.get(ord.id) || mapaInformesPorOrden.get(ord.numeroOrden) || [];
          infsAsociados.sort((a, b) => {
            const fa = extraerFechaDate(a.fechaCaptura || a.fechaCreacion || a.fechaVisita) || 0;
            const fb = extraerFechaDate(b.fechaCaptura || b.fechaCreacion || b.fechaVisita) || 0;
            return fb - fa;
          });
          const ultimoInforme = infsAsociados[0] || null;

          const titularObj = ord.titular || {};
          let clienteNombre = titularObj.nombre || [titularObj.nombres, titularObj.apellidoPaterno].filter(Boolean).join(" ");
          if (!clienteNombre) clienteNombre = ord.clienteNombre || ord.nombreTitular || ord.cliente || "Cliente";

          const difuntoNombre = extraerNombreDifunto(ord.difunto || ord.nombreDifunto || ord.enMemoriaDe);
          const plan = ord.servicio?.planNombre || ord.planNombre || ord.plan || "Plan Específico";
          const operador = ord.operadorAsignadoNombre || ord.operador || ultimoInforme?.operadorNombre || "Sin Asignar";

          const ubi = ord.ubicacionSepultura || {};
          const cementerio = ubi.cementerio || ord.cementerio || ultimoInforme?.cementerio || "No especificado";
          const sector = ubi.sector || ord.sector || ultimoInforme?.sector || "-";
          const lote = ubi.numeroSepultura || ord.lote || ultimoInforme?.lote || "-";
          const estado = (ord.estado || "activa").toLowerCase();

          const fechaContrato = ord.creadoEl || ord.createdAt || ord.fechaContratacion || ord.fechaPago;
          const fechaTermino = ord.fechaTermino || ord.vigenciaHasta || ord.fechaFin;
          const fechaUltimaVisita = ord.fechaUltimaVisita || ord.fechaAprobacion || ultimoInforme?.fechaCaptura;
          const fechaProximaVisita = ord.proximaVisita || ord.fechaProximaVisita;

          const monto = Number(ord.montoTotal || ord.precioNumerico || ord.valores?.total || 0);
          const realizadas = ord.serviciosRealizados ?? (infsAsociados.length > 0 ? infsAsociados.length : (estado === "completada" ? 1 : 0));
          const pendientes = Math.max(0, (ord.visitas || 1) - realizadas);
          const pdfUrl = ord.ultimoInformePdfUrl || ultimoInforme?.pdfUrl || "";

          return {
            id: ord.id,
            ordenId: ord.numeroOrden || ord.id,
            cliente: clienteNombre,
            difunto: difuntoNombre,
            plan: plan,
            operador: operador,
            fechaContrato: fechaContrato,
            fechaContratoDate: extraerFechaDate(fechaContrato),
            fechaTermino: fechaTermino,
            monto: monto,
            realizadas: realizadas,
            pendientes: pendientes,
            ultimaVisita: fechaUltimaVisita,
            proximaVisita: fechaProximaVisita,
            cementerio: cementerio,
            sector: sector,
            lote: lote,
            estado: estado,
            ultimoInforme: ultimoInforme,
            pdfUrl: pdfUrl
          };
        });

        poblarOpcionesFiltros(listaTotalTrabajos);
        renderizarTabla(listaTotalTrabajos);
        badge.textContent = `${listaTotalTrabajos.length} trabajos registrados`;

      } catch (err) {
        console.error("Error al cargar todos los trabajos:", err);
        cuerpo.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-red-600 font-semibold">Error al sincronizar con Firestore: ${err.message}</td></tr>`;
        badge.textContent = "Error al conectar";
      }
    };

    function poblarOpcionesFiltros(lista) {
      const llenarSelect = (idSelect, valores) => {
        const sel = document.getElementById(idSelect);
        if (!sel) return;
        const seleccionados = Array.from(sel.selectedOptions).map(o => o.value);
        sel.innerHTML = "";
        Array.from(valores).sort().forEach(val => {
          if (!val || val === "-" || val === "Sin Asignar") return;
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val;
          if (seleccionados.includes(val)) opt.selected = true;
          sel.appendChild(opt);
        });
      };

      llenarSelect("select-filtro-cliente", new Set(lista.map(i => i.cliente)));
      llenarSelect("select-filtro-plan", new Set(lista.map(i => i.plan)));
      llenarSelect("select-filtro-operador", new Set(lista.map(i => i.operador)));
      llenarSelect("select-filtro-cementerio", new Set(lista.map(i => i.cementerio)));
    }

    function aplicarFiltros() {
      const q = document.getElementById("filtro-texto-global").value.toLowerCase().trim();
      const mesFiltro = document.getElementById("filtro-mes").value;
      const anioFiltro = document.getElementById("filtro-anio").value;
      const desdeFiltro = document.getElementById("filtro-desde").value;
      const hastaFiltro = document.getElementById("filtro-hasta").value;

      const getSeleccionados = id => Array.from(document.getElementById(id).selectedOptions).map(o => o.value.toLowerCase());
      const clientesSel = getSeleccionados("select-filtro-cliente");
      const planesSel = getSeleccionados("select-filtro-plan");
      const operadoresSel = getSeleccionados("select-filtro-operador");
      const cementeriosSel = getSeleccionados("select-filtro-cementerio");
      const estadosSel = getSeleccionados("select-filtro-estado");

      const dDesde = desdeFiltro ? new Date(desdeFiltro + "T00:00:00") : null;
      const dHasta = hastaFiltro ? new Date(hastaFiltro + "T23:59:59") : null;

      const filtrados = listaTotalTrabajos.filter(item => {
        if (q) {
          const matchTexto = 
            item.cliente.toLowerCase().includes(q) ||
            item.difunto.toLowerCase().includes(q) ||
            item.cementerio.toLowerCase().includes(q) ||
            item.ordenId.toLowerCase().includes(q) ||
            item.plan.toLowerCase().includes(q);
          if (!matchTexto) return false;
        }

        if (item.fechaContratoDate) {
          if (mesFiltro !== "" && item.fechaContratoDate.getMonth() !== Number(mesFiltro)) return false;
          if (anioFiltro !== "" && item.fechaContratoDate.getFullYear() !== Number(anioFiltro)) return false;
          if (dDesde && item.fechaContratoDate < dDesde) return false;
          if (dHasta && item.fechaContratoDate > dHasta) return false;
        } else if (mesFiltro !== "" || anioFiltro !== "" || dDesde || dHasta) {
          return false;
        }

        if (clientesSel.length > 0 && !clientesSel.includes(item.cliente.toLowerCase())) return false;
        if (planesSel.length > 0 && !planesSel.includes(item.plan.toLowerCase())) return false;
        if (operadoresSel.length > 0 && !operadoresSel.includes(item.operador.toLowerCase())) return false;
        if (cementeriosSel.length > 0 && !cementeriosSel.includes(item.cementerio.toLowerCase())) return false;
        if (estadosSel.length > 0 && !estadosSel.includes(item.estado.toLowerCase())) return false;

        return true;
      });

      renderizarTabla(filtrados);
      document.getElementById("badge-total").textContent = `${filtrados.length} de ${listaTotalTrabajos.length} trabajos`;
    }

    function renderizarTabla(datos) {
      const cuerpo = document.getElementById("tabla-cuerpo");
      cuerpo.innerHTML = "";

      if (datos.length === 0) {
        cuerpo.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-slate-400 font-medium">No se encontraron trabajos con los filtros seleccionados.</td></tr>`;
        return;
      }

      datos.forEach(t => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50 transition border-b border-slate-100 cursor-pointer";

        tr.innerHTML = `
          <td class="p-3">
            <span class="font-bold text-slate-900 block">${t.cliente}</span>
            <span class="text-[11px] text-brandMuted block">Difunto: ${t.difunto}</span>
            <span class="text-[10px] text-slate-400 font-mono">${t.ordenId}</span>
          </td>
          <td class="p-3 font-medium text-slate-700">${t.plan}</td>
          <td class="p-3">
            <span class="px-2 py-0.5 rounded-full text-[11px] ${t.operador === 'Sin Asignar' ? 'bg-amber-100 text-amber-800 font-bold' : 'bg-slate-100 text-slate-800'}">
              ${t.operador}
            </span>
          </td>
          <td class="p-3 whitespace-nowrap text-slate-600">${formatearFecha(t.fechaContrato)}</td>
          <td class="p-3 whitespace-nowrap text-slate-600">${formatearFecha(t.fechaTermino)}</td>
          <td class="p-3 text-right font-bold text-slate-900">${formatearDinero(t.monto)}</td>
          <td class="p-3 text-center">
            <span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold text-[11px]">${t.realizadas}</span>
          </td>
          <td class="p-3 text-center">
            <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-800 font-bold text-[11px]">${t.pendientes}</span>
          </td>
          <td class="p-3 whitespace-nowrap text-slate-600">${formatearFecha(t.ultimaVisita)}</td>
          <td class="p-3 whitespace-nowrap text-slate-600 font-semibold text-brand">${formatearFecha(t.proximaVisita)}</td>
          <td class="p-3">
            <span class="font-medium text-slate-800 block">${t.cementerio}</span>
            <span class="text-[10px] text-slate-400 block">Sec: ${t.sector} | Lote: ${t.lote}</span>
          </td>
          <td class="p-3 text-center" onclick="event.stopPropagation()">
            <button class="btn-ver-modal p-1.5 rounded-lg bg-teal-50 text-teal-800 hover:bg-teal-100 border border-teal-200 transition cursor-pointer" title="Ver Evidencias y Ficha">
              <span class="material-symbols-outlined text-base">visibility</span>
            </button>
          </td>
        `;

        tr.addEventListener("click", () => abrirModalTrabajo(t));
        tr.querySelector(".btn-ver-modal").addEventListener("click", () => abrirModalTrabajo(t));
        cuerpo.appendChild(tr);
      });
    }

    function abrirModalTrabajo(trabajo) {
      const inf = trabajo.ultimoInforme;

      document.getElementById("modal-orden-id").textContent = trabajo.ordenId;
      document.getElementById("modal-difunto").textContent = trabajo.difunto;
      document.getElementById("modal-subtitulo").textContent = `Plan: ${trabajo.plan} • Estado: ${trabajo.estado.toUpperCase()}`;
      document.getElementById("modal-cliente").textContent = trabajo.cliente;
      document.getElementById("modal-operador").textContent = trabajo.operador;
      document.getElementById("modal-ubicacion").textContent = `${trabajo.cementerio} - Sector: ${trabajo.sector}, Lote: ${trabajo.lote}`;
      document.getElementById("modal-observaciones").textContent = inf?.nota || inf?.notas || inf?.observaciones || "Sin observaciones técnicas registradas.";

      const cargarFotoBox = (idBox, url, titulo) => {
        const box = document.getElementById(idBox);
        if (url) {
          box.innerHTML = `<a href="${url}" target="_blank" title="Abrir imagen"><img src="${url}" class="thumb-mini hover:opacity-90 transition cursor-pointer" alt="${titulo}"></a>`;
        } else {
          box.innerHTML = `<div class="thumb-mini bg-slate-100 flex items-center justify-center text-slate-400 text-[10px] italic">Sin foto</div>`;
        }
      };

      const extraerFotoUrl = (f) => typeof f === 'string' ? f : (f?.url || f?.previewBase64 || "");
      const fotos = inf?.fotos || inf?.fotosUrls || {};
      cargarFotoBox("box-foto-antes", extraerFotoUrl(fotos.antes), "Antes");
      cargarFotoBox("box-foto-despues", extraerFotoUrl(fotos.despues), "Después");
      cargarFotoBox("box-foto-flores", extraerFotoUrl(fotos.flores), "Flores");
      cargarFotoBox("box-foto-general", extraerFotoUrl(fotos.general || fotos.panoramica), "Panorámica");

      const btnOficial = document.getElementById("btn-modal-ver-oficial");
      btnOficial.onclick = () => {
        if (trabajo.pdfUrl && trabajo.pdfUrl.startsWith("https://")) {
          window.open(trabajo.pdfUrl, "_blank");
        } else if (inf?.pdfUrl && inf.pdfUrl.startsWith("https://")) {
          window.open(inf.pdfUrl, "_blank");
        } else {
          const infIdParam = inf?.id ? `&informeId=${inf.id}` : "";
          const urlFallback = `https://gravecare.cl/informe.html?ordenId=${trabajo.ordenId}${infIdParam}`;
          window.open(urlFallback, "_blank");
        }
      };

      document.getElementById("modal-informe").classList.remove("hidden");
    }

    function cerrarModalInforme() {
      document.getElementById("modal-informe").classList.add("hidden");
    }

    document.getElementById("btn-recargar")?.addEventListener("click", window.cargarTodosLosTrabajos);
    document.getElementById("btn-cerrar-modal")?.addEventListener("click", cerrarModalInforme);
    document.getElementById("btn-modal-imprimir")?.addEventListener("click", () => window.print());

    document.getElementById("modal-informe")?.addEventListener("click", (e) => {
      if (e.target.id === "modal-informe") cerrarModalInforme();
    });

    const triggers = [
      "filtro-texto-global", "filtro-mes", "filtro-anio", "filtro-desde", "filtro-hasta",
      "select-filtro-cliente", "select-filtro-plan", "select-filtro-operador", "select-filtro-cementerio", "select-filtro-estado"
    ];

    triggers.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener("input", aplicarFiltros);
        el.addEventListener("change", aplicarFiltros);
      }
    });

    document.getElementById("btn-limpiar")?.addEventListener("click", () => {
      document.getElementById("filtro-texto-global").value = "";
      document.getElementById("filtro-mes").value = "";
      document.getElementById("filtro-anio").value = "";
      document.getElementById("filtro-desde").value = "";
      document.getElementById("filtro-hasta").value = "";
      ["select-filtro-cliente", "select-filtro-plan", "select-filtro-operador", "select-filtro-cementerio", "select-filtro-estado"].forEach(id => {
        const s = document.getElementById(id);
        if (s) Array.from(s.options).forEach(opt => opt.selected = false);
      });
      aplicarFiltros();
    });

    requireStaffAccess(async () => {
      await window.cargarTodosLosTrabajos();
    });
  </script>
