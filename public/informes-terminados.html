<script type="module">
    import { db } from "./js/firebaseConfig.js";
    import { requireStaffAccess } from "./js/portal-common.js";
    import { 
      collection, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    let todosLosInformes = [];

    function extraerNombreDifunto(obj) {
      if (!obj) return "Ser Querido";
      if (typeof obj === "string" && obj.trim()) return obj.trim();
      if (typeof obj === "object") {
        if (obj.nombreCompleto && obj.nombreCompleto.trim()) return obj.nombreCompleto.trim();
        const nom = obj.nombre || obj.nombres || "";
        const ape = obj.apellido || obj.apellidos || obj.apellidoPaterno || "";
        const combo = `${nom} ${ape}`.trim();
        if (combo) return combo;
      }
      return "Ser Querido";
    }

    function extraerUrlFoto(fotoObj) {
      if (!fotoObj) return "";
      if (typeof fotoObj === "string") return fotoObj;
      if (typeof fotoObj === "object" && fotoObj.url) return fotoObj.url;
      return "";
    }

    window.ampliarFoto = function(url, pie) {
      const modal = document.getElementById("modal-visor");
      document.getElementById("img-visor").src = url;
      document.getElementById("pie-visor").textContent = pie || "";
      modal.classList.remove("hidden");
    };

    window.cerrarVisor = function() {
      document.getElementById("modal-visor").classList.add("hidden");
    };

    window.verInformeCliente = function(informeId, ordenId) {
      window.open(`informe.html?informeId=${informeId}&ordenId=${ordenId}`, '_blank');
    };

    window.imprimirInforme = function(informeId) {
      const item = todosLosInformes.find(i => i.id === informeId);
      if (!item) return;

      const ventana = window.open('', '_blank');
      ventana.document.write(
        '<html>' +
        '<head>' +
        '<title>GraveCare - Certificado #' + item.numeroOrden + '</title>' +
        '<style>' +
        'body { font-family: sans-serif; padding: 25px; color: #111; }' +
        'h1 { color: #002d1a; margin-bottom: 4px; }' +
        '.datos { margin: 15px 0; border-collapse: collapse; width: 100%; }' +
        '.datos td { padding: 6px 10px; border-bottom: 1px solid #eee; font-size: 13px; }' +
        '.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }' +
        '.grid img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }' +
        '.pie { margin-top: 5px; font-size: 12px; font-weight: bold; }' +
        '</style>' +
        '</head>' +
        '<body>' +
        '<h1>GraveCare Chile — Certificado de Servicio</h1>' +
        '<p style="color: #666; font-size: 12px; margin-top: 0;">Evidencia oficial de mantención técnica aprobada.</p>' +
        '<table class="datos">' +
        '<tr><td><strong>N° Orden:</strong> ' + item.numeroOrden + '</td><td><strong>Fecha Servicio:</strong> ' + formatFecha(item.fechaCaptura) + '</td></tr>' +
        '<tr><td><strong>Difunto:</strong> ' + item.difunto + '</td><td><strong>Cliente:</strong> ' + item.clienteNombre + ' (' + item.clienteEmail + ')</td></tr>' +
        '<tr><td><strong>Ubicación:</strong> ' + item.cementerio + ' · Sector: ' + item.sector + ', Sepultura: #' + item.lote + '</td><td><strong>Operador:</strong> ' + item.operadorNombre + '</td></tr>' +
        '<tr><td colspan="2"><strong>Observaciones:</strong> ' + (item.nota || 'Labores ejecutadas en conformidad técnica.') + '</td></tr>' +
        '</table>' +
        '<div class="grid">' +
        '<div><img src="' + item.fAntes + '"><div class="pie">1. Estado Inicial - Antes</div></div>' +
        '<div><img src="' + item.fDespues + '"><div class="pie">2. Estado Final - Después</div></div>' +
        '<div><img src="' + item.fFlores + '"><div class="pie">3. Ornamentación Floral</div></div>' +
        '<div><img src="' + item.fGeneral + '"><div class="pie">4. Vista Panorámica</div></div>' +
        '</div>' +
        '<script>window.print();<\/script>' +
        '</body>' +
        '</html>'
      );
      ventana.document.close();
    };

    function formatFecha(str) {
      if (!str) return "-";
      const f = new Date(str);
      if (isNaN(f.getTime())) return str;
      return f.toLocaleDateString("es-CL", { day: "2-digit", month: "long", year: "numeric" });
    }

    async function cargarInformesTerminados() {
      const contenedor = document.getElementById("contenedor-informes");

      try {
        const ordenesMap = new Map();

        // 1. Cargar metadatos de órdenes de forma aislada
        try {
          const snapOrdenes = await getDocs(collection(db, "ordenes"));
          snapOrdenes.forEach(docSnap => {
            const d = docSnap.data();
            const titular = d.titular ? ((d.titular.nombres || '') + ' ' + (d.titular.apellidoPaterno || '')).trim() : (d.nombreTitular || d.email || "Cliente Web");
            const difunto = extraerNombreDifunto(d.difunto || d.nombreDifunto || d.nombreFallecido);
            const numOrden = d.numeroOrden || docSnap.id.replace("orden_", "").substring(0, 8);
            const ubi = d.ubicacionSepultura || {};

            ordenesMap.set(docSnap.id, {
              ordenId: docSnap.id,
              titular: titular || "Cliente Web",
              email: (d.titular?.email || d.email || "").toLowerCase(),
              numeroOrden: numOrden,
              difunto: difunto,
              cementerio: ubi.cementerio || d.cementerio || "-",
              sector: ubi.sector || "S/S",
              lote: ubi.numeroSepultura || ubi.numero || "S/N",
              operadorNombre: d.operadorAsignadoNombre || "Staff Operativo",
              fechaAprobacion: d.fechaAprobacion || d.fechaCompletada || (d.updatedAt?.toDate ? d.updatedAt.toDate().toISOString() : new Date().toISOString()),
              fotos: d.fotos || {}
            });
          });
        } catch (e) {
          console.warn("Aviso al leer órdenes:", e);
        }

        const listaMap = new Map();

        // 2. Fuente principal: Colección 'informes'
        try {
          const snapInformes = await getDocs(collection(db, "informes"));
          snapInformes.forEach(docSnap => {
            const inf = { id: docSnap.id, ...docSnap.data() };
            const estado = (inf.estado || "").toLowerCase().trim();

            const fAntes = extraerUrlFoto(inf.fotos?.antes);
            const fDespues = extraerUrlFoto(inf.fotos?.despues);
            const fFlores = extraerUrlFoto(inf.fotos?.flores);
            const fGeneral = extraerUrlFoto(inf.fotos?.general);

            // Acepta aprobados de 'informe-revision.html' o informes con evidencia final
            const estaAprobado = ["aprobado", "aprobada", "completada", "completado", "terminado", "finalizado"].includes(estado) || Boolean(fDespues);

            if (estaAprobado) {
              const datosOrden = ordenesMap.get(inf.ordenId) || {};
              const claveUnica = inf.ordenId || inf.id;

              const nombreDifFinal = extraerNombreDifunto(inf.difunto) !== "Ser Querido" 
                ? extraerNombreDifunto(inf.difunto) 
                : (datosOrden.difunto || "Ser Querido");

              let numOrdVisible = inf.numeroOrden || datosOrden.numeroOrden || "";
              if (!numOrdVisible || numOrdVisible === "S/N" || numOrdVisible === "ORD-") {
                numOrdVisible = inf.ordenId || inf.id.replace("informe_", "");
              }

              listaMap.set(claveUnica, {
                id: inf.id,
                ordenId: inf.ordenId || inf.id,
                clienteNombre: datosOrden.titular || inf.clienteNombre || "Cliente Web",
                clienteEmail: datosOrden.email || (inf.clienteEmail || "").toLowerCase(),
                numeroOrden: numOrdVisible,
                difunto: nombreDifFinal,
                cementerio: inf.cementerio || datosOrden.cementerio || "-",
                sector: inf.sector || datosOrden.sector || "S/S",
                lote: inf.lote || datosOrden.lote || "S/N",
                operadorNombre: inf.operadorNombre || datosOrden.operadorNombre || "Staff",
                nota: inf.nota || "",
                fAntes: fAntes || extraerUrlFoto(datosOrden.fotos?.antes),
                fDespues: fDespues || extraerUrlFoto(datosOrden.fotos?.despues),
                fFlores: fFlores || extraerUrlFoto(datosOrden.fotos?.flores),
                fGeneral: fGeneral || extraerUrlFoto(datosOrden.fotos?.general),
                fechaCaptura: inf.fechaCaptura || inf.fechaAprobacion || datosOrden.fechaAprobacion,
                fechaAprobacion: inf.fechaAprobacion || datosOrden.fechaAprobacion,
                fechaBusqueda: (inf.fechaCaptura || inf.fechaAprobacion || datosOrden.fechaAprobacion || "").split("T")[0]
              });
            }
          });
        } catch (e) {
          console.error("Error al leer colección informes:", e);
        }

        const listaFinal = Array.from(listaMap.values());
        listaFinal.sort((a, b) => new Date(b.fechaCaptura || 0) - new Date(a.fechaCaptura || 0));
        todosLosInformes = listaFinal;

        aplicarFiltros();

      } catch (err) {
        console.error("Error general en cargarInformesTerminados:", err);
        contenedor.innerHTML = '<p style="color: #dc2626; text-align: center; font-weight: 600;">Error al cargar registros: ' + (err.message || err) + '</p>';
      }
    }

    function aplicarFiltros() {
      const fCliente = document.getElementById("filtro-cliente").value.toLowerCase().trim();
      const fDifunto = document.getElementById("filtro-difunto").value.toLowerCase().trim();
      const fDesde = document.getElementById("filtro-desde").value;
      const fHasta = document.getElementById("filtro-hasta").value;

      const filtrados = todosLosInformes.filter(inf => {
        if (fCliente) {
          const coincideNom = (inf.clienteNombre || "").toLowerCase().includes(fCliente);
          const coincideEmail = (inf.clienteEmail || "").toLowerCase().includes(fCliente);
          if (!coincideNom && !coincideEmail) return false;
        }

        if (fDifunto) {
          const coincideDif = (inf.difunto || "").toLowerCase().includes(fDifunto);
          if (!coincideDif) return false;
        }

        if (fDesde && inf.fechaBusqueda < fDesde) return false;
        if (fHasta && inf.fechaBusqueda > fHasta) return false;

        return true;
      });

      renderizarLista(filtrados);
    }

    function renderizarLista(lista) {
      const contenedor = document.getElementById("contenedor-informes");
      const contador = document.getElementById("contador-resultados");

      contador.textContent = 'Mostrando ' + lista.length + ' informe(s) terminado(s)';

      if (lista.length === 0) {
        contenedor.innerHTML = 
          '<div style="background: white; border-radius: 12px; padding: 2.5rem; text-align: center; border: 1px solid #e2e8f0;">' +
          '<p style="color: #64748b; margin: 0; font-weight: 600;">No se encontraron informes terminados para los criterios seleccionados.</p>' +
          '</div>';
        return;
      }

      contenedor.innerHTML = lista.map(inf => {
        const opNombre = inf.operadorNombre || 'Staff';

        let htmlBloqueNota = '';
        if (inf.nota) {
          htmlBloqueNota = 
            '<div style="background: #f8faf8; border: 1px solid #e2e8f0; border-radius: 6px; padding: 0.6rem; margin-top: 0.75rem; font-size: 0.8rem; color: #334155;">' +
            '<strong>Nota del Operador (' + opNombre + '):</strong> ' + inf.nota +
            '</div>';
        }

        const slotAntes = inf.fAntes
          ? '<img src="' + inf.fAntes + '" class="thumb-foto" onclick="ampliarFoto(\'' + inf.fAntes + '\', \'1. Antes - ' + (inf.difunto || '') + '\')">'
          : '<div style="background: #f1f5f9; height: 125px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #94a3b8;">Sin foto</div>';

        const slotDespues = inf.fDespues
          ? '<img src="' + inf.fDespues + '" class="thumb-foto" onclick="ampliarFoto(\'' + inf.fDespues + '\', \'2. Después - ' + (inf.difunto || '') + '\')">'
          : '<div style="background: #f1f5f9; height: 125px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #94a3b8;">Sin foto</div>';

        const slotFlores = inf.fFlores
          ? '<img src="' + inf.fFlores + '" class="thumb-foto" onclick="ampliarFoto(\'' + inf.fFlores + '\', \'3. Flores - ' + (inf.difunto || '') + '\')">'
          : '<div style="background: #f1f5f9; height: 125px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #94a3b8;">Sin foto</div>';

        const slotGeneral = inf.fGeneral
          ? '<img src="' + inf.fGeneral + '" class="thumb-foto" onclick="ampliarFoto(\'' + inf.fGeneral + '\', \'4. Vista Panorámica - ' + (inf.difunto || '') + '\')">'
          : '<div style="background: #f1f5f9; height: 125px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #94a3b8;">Sin foto</div>';

        const numMostrar = inf.numeroOrden.startsWith('ORD-') ? inf.numeroOrden : 'ORD-' + inf.numeroOrden;

        return (
          '<div class="card-informe">' +
            '<div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 0.5rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.75rem;">' +
              '<div>' +
                '<span style="font-size: 0.75rem; font-weight: 700; color: #64748b;">' + numMostrar + '</span>' +
                '<h3 style="margin: 0.2rem 0; color: #002d1a; font-size: 1.1rem;">' + (inf.difunto || "Sin difunto") + '</h3>' +
                '<p style="margin: 0; font-size: 0.85rem; color: #475569;">' +
                  '<strong>Cliente:</strong> ' + inf.clienteNombre + ' (' + (inf.clienteEmail || "S/C") + ') · ' +
                  '<strong>Cementerio:</strong> ' + (inf.cementerio || "-") + ' · Sector: ' + (inf.sector || "S/S") + ', Sepultura #' + (inf.lote || "S/N") +
                '</p>' +
              '</div>' +
              '<div style="text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">' +
                '<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">' +
                  '<span class="badge-aprobado">✓ Completada</span>' +
                  '<button class="btn-gestion btn-cliente" onclick="verInformeCliente(\'' + inf.id + '\', \'' + inf.ordenId + '\')">' +
                    '<span class="material-symbols-outlined" style="font-size: 16px;">visibility</span> Ver Informe Oficial' +
                  '</button>' +
                  '<button class="btn-gestion" onclick="imprimirInforme(\'' + inf.id + '\')">' +
                    '<span class="material-symbols-outlined" style="font-size: 16px;">print</span> Imprimir Ficha' +
                  '</button>' +
                '</div>' +
                '<p style="margin: 0; font-size: 0.8rem; color: #64748b;">Aprobado el ' + formatFecha(inf.fechaAprobacion || inf.fechaCaptura) + '</p>' +
              '</div>' +
            '</div>' +
            htmlBloqueNota +
            '<div class="grid-fotos">' +
              '<div><span style="font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase;">1. Antes</span>' + slotAntes + '</div>' +
              '<div><span style="font-size: 0.7rem; font-weight: 700; color: #002d1a; text-transform: uppercase;">2. Después</span>' + slotDespues + '</div>' +
              '<div><span style="font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase;">3. Flores</span>' + slotFlores + '</div>' +
              '<div><span style="font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase;">4. General</span>' + slotGeneral + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join("");
    }

    document.getElementById("filtro-cliente").addEventListener("input", aplicarFiltros);
    document.getElementById("filtro-difunto").addEventListener("input", aplicarFiltros);
    document.getElementById("filtro-desde").addEventListener("change", aplicarFiltros);
    document.getElementById("filtro-hasta").addEventListener("change", aplicarFiltros);

    document.getElementById("btn-limpiar").addEventListener("click", () => {
      document.getElementById("filtro-cliente").value = "";
      document.getElementById("filtro-difunto").value = "";
      document.getElementById("filtro-desde").value = "";
      document.getElementById("filtro-hasta").value = "";
      aplicarFiltros();
    });

    requireStaffAccess(async (user, staffProfile) => {
      await cargarInformesTerminados();
    }, "informes-terminados.html");
  </script>
