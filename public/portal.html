<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Portal de Operaciones | GraveCare</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Barra lateral */
    .sidebar {
      width: 250px;
      background-color: #002d1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      transition: transform 0.3s ease;
      z-index: 50;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 22px 20px;
      font-size: 1.25rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .sidebar-brand i { color: #34d399; font-size: 1.4rem; }

    .sidebar-menu {
      list-style: none;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 8px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .nav-btn.active {
      background-color: #4ade80;
      color: #002d1a;
      font-weight: 700;
    }

    /* Área central */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }
    .topbar {
      height: 64px;
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-toggle-menu {
      display: none;
      background: none;
      border: none;
      font-size: 1.25rem;
      color: #002d1a;
      cursor: pointer;
      padding: 6px;
    }
    .topbar-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-role {
      background-color: #dcfce7;
      color: #166534;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .user-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e293b;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-logout {
      border: 1px solid #fecaca;
      background-color: #fef2f2;
      color: #dc2626;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-logout:hover { background-color: #fee2e2; }

    /* Iframe contenedor */
    .content-frame {
      flex: 1;
      width: 100%;
      height: calc(100vh - 64px);
      border: none;
      background-color: #f8fafc;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 40;
    }

    @media (max-width: 768px) {
      .btn-toggle-menu { display: block; }
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.active { display: block; }
      .user-name { display: none; }
    }
  </style>
</head>
<body>

  <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- Barra lateral única -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i class="fa-solid fa-leaf"></i>
      <span>GraveCare Ops</span>
    </div>
    <ul class="sidebar-menu">
      <li>
        <button class="nav-btn active" id="btn-mis-trabajos" onclick="cargarModulo('mis-trabajos')">
          <i class="fa-solid fa-briefcase"></i> Mis Trabajos
        </button>
      </li>
      <li class="admin-only" style="display: none;">
        <button class="nav-btn" id="btn-todos-los-trabajos" onclick="cargarModulo('todos-los-trabajos')">
          <i class="fa-solid fa-list-check"></i> Todos los Trabajos
        </button>
      </li>
      <li class="admin-only" style="display: none;">
        <button class="nav-btn" id="btn-planificacion" onclick="cargarModulo('planificacion')">
          <i class="fa-solid fa-calendar-days"></i> Planificación & Gantt
        </button>
      </li>
      <li class="admin-only" style="display: none;">
        <button class="nav-btn" id="btn-ordenes" onclick="cargarModulo('ordenes')">
          <i class="fa-solid fa-file-invoice"></i> Órdenes de Servicio
        </button>
      </li>
      <li class="admin-only" style="display: none;">
        <button class="nav-btn" id="btn-mapa" onclick="cargarModulo('mapa')">
          <i class="fa-solid fa-map-location-dot"></i> Mapa de Operaciones
        </button>
      </li>
      <li class="admin-only" style="display: none;">
        <button class="nav-btn" id="btn-gastos-ingresos" onclick="cargarModulo('gastos-ingresos')">
          <i class="fa-solid fa-wallet"></i> Gastos e Ingresos
        </button>
      </li>
      <li class="admin-only" style="display: none;">
        <button class="nav-btn" id="btn-informe-revision" onclick="cargarModulo('informe-revision')">
          <i class="fa-solid fa-clipboard-check"></i> Revisión Informes
        </button>
      </li>
      <li class="admin-only" style="display: none;">
        <button class="nav-btn" id="btn-clientes" onclick="cargarModulo('clientes')">
          <i class="fa-solid fa-address-book"></i> Clientes
        </button>
      </li>
      <li class="admin-only" style="display: none;">
        <button class="nav-btn" id="btn-admin-usuarios" onclick="cargarModulo('admin-usuarios')">
          <i class="fa-solid fa-users-gear"></i> Gestión de Usuarios
        </button>
      </li>
    </ul>
  </aside>

  <!-- Contenedor Derecho -->
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-toggle-menu" onclick="toggleSidebar()" aria-label="Abrir menú">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="topbar-title">
          <i class="fa-solid fa-briefcase" id="currentIcon"></i>
          <span id="currentTitle">Mis Trabajos</span>
        </div>
      </div>
      <div class="topbar-user">
        <span class="badge-role" id="badgeRole">...</span>
        <span class="user-name" id="userName">Cargando...</span>
        <button class="btn-logout" id="btnLogout">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Salir
        </button>
      </div>
    </header>

    <iframe id="moduloFrame" class="content-frame" src="about:blank"></iframe>
  </div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { initializeFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAthgIWiVPDuscljVjQRAX-vIeUYLbrSC0",
      authDomain: "gravecare-2e8d2.firebaseapp.com",
      projectId: "gravecare-2e8d2",
      storageBucket: "gravecare-2e8d2.firebasestorage.app",
      messagingSenderId: "160012946248",
      appId: "1:160012946248:web:8c3e73100f1e92c485c17d"
    };

    const app = getApps().length > 0 ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    // Conexión estable anti-timeout QUIC
    const db = initializeFirestore(app, {
      experimentalForceLongPolling: true,
      useFetchStreams: false
    });

    let rolActual = "operador";
    let moduloActual = "";
    let sesionIniciadaPreviamente = false;

    const titulosModulos = {
      "mis-trabajos": { title: "Mis Trabajos", icon: "fa-solid fa-briefcase" },
      "todos-los-trabajos": { title: "Todos los Trabajos", icon: "fa-solid fa-list-check" },
      "planificacion": { title: "Planificación & Carta Gantt", icon: "fa-solid fa-calendar-days" },
      "ordenes": { title: "Órdenes de Servicio", icon: "fa-solid fa-file-invoice" },
      "mapa": { title: "Mapa de Operaciones", icon: "fa-solid fa-map-location-dot" },
      "gastos-ingresos": { title: "Gastos e Ingresos", icon: "fa-solid fa-wallet" },
      "informe-revision": { title: "Revisión de Informes", icon: "fa-solid fa-clipboard-check" },
      "clientes": { title: "Gestión de Clientes", icon: "fa-solid fa-address-book" },
      "admin-usuarios": { title: "Gestión de Usuarios", icon: "fa-solid fa-users-gear" }
    };

    window.toggleSidebar = function() {
      const sb = document.getElementById("sidebar");
      const ov = document.getElementById("sidebarOverlay");
      sb.classList.toggle("open");
      ov.classList.toggle("active");
    };

    window.cargarModulo = function(nombre) {
      if (rolActual === "operador" && nombre !== "mis-trabajos") {
        nombre = "mis-trabajos";
      }

      moduloActual = nombre;

      const iframe = document.getElementById("moduloFrame");
      // Timestamp dinámico para evitar retención de caché entre cambios
      iframe.src = `${nombre}.html?t=${Date.now()}`;

      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      const btnActual = document.getElementById("btn-" + nombre);
      if (btnActual) btnActual.classList.add("active");

      const info = titulosModulos[nombre] || { title: "Operaciones", icon: "fa-solid fa-circle" };
      document.getElementById("currentTitle").textContent = info.title;
      document.getElementById("currentIcon").className = info.icon;

      const sb = document.getElementById("sidebar");
      const ov = document.getElementById("sidebarOverlay");
      if (sb.classList.contains("open")) {
        sb.classList.remove("open");
        ov.classList.remove("active");
      }
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        if (sesionIniciadaPreviamente) {
          console.warn("Aviso: Pérdida temporal de red. Manteniendo sesión en pantalla...");
          return;
        }
        window.location.replace("login-ops.html");
        return;
      }

      sesionIniciadaPreviamente = true;

      const emailLower = (user.email || "").toLowerCase().trim();
      let nombre = user.displayName || user.email;

      if (emailLower === "colivaresl@hotmail.com" || emailLower === "admin@gravecare.cl") {
        rolActual = "administrador";
        nombre = "Christian Olivares";
      } else {
        try {
          const snap = await getDoc(doc(db, "staff", user.uid));
          if (snap.exists()) {
            const data = snap.data();
            rolActual = (data.rol || "operador").toLowerCase();
            nombre = data.nombre || nombre;
          }
        } catch (e) {
          console.warn("Validando staff:", e);
        }
      }

      document.getElementById("userName").textContent = nombre;
      document.getElementById("badgeRole").textContent = rolActual.toUpperCase();

      const adminBtns = document.querySelectorAll(".admin-only");
      if (rolActual === "operador") {
        adminBtns.forEach(el => el.style.display = "none");
        cargarModulo("mis-trabajos");
      } else {
        adminBtns.forEach(el => el.style.display = "block");
        const rawHash = window.location.hash.replace("#", "").trim();
        const hashValido = (rawHash && titulosModulos[rawHash]) ? rawHash : "mis-trabajos";
        cargarModulo(hashValido);
      }
    });

    document.getElementById("btnLogout").addEventListener("click", async () => {
      sesionIniciadaPreviamente = false;
      await signOut(auth);
      window.location.replace("login-ops.html");
    });
  </script>
</body>
</html>
