<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Portal de Operaciones | GraveCare Ops</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: "#002d1a",
            brandLight: "#1a432f",
            brandMuted: "#4e6451",
            brandAccent: "#10b981",
            sidebarDark: "#042215"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: 0.75rem;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #94a3b8;
      transition: all 0.15s ease-in-out;
    }
    .nav-btn:hover {
      background-color: rgba(255, 255, 255, 0.06);
      color: #f8fafc;
    }
    .nav-btn.active {
      background-color: #86efac;
      color: #064e3b;
      font-weight: 700;
    }
    .nav-btn.active span {
      color: #064e3b;
    }
  </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden text-slate-800">

  <!-- 1. BARRA LATERAL (SIDEBAR) -->
  <aside class="w-64 bg-sidebarDark flex flex-col justify-between shrink-0 shadow-xl z-20">
    <div class="p-4 space-y-6">
      
      <!-- Logo GraveCare Ops -->
      <div class="flex items-center gap-2.5 px-2">
        <span class="material-symbols-outlined text-emerald-400 text-2xl">spa</span>
        <span class="text-white font-extrabold text-lg tracking-tight">GraveCare Ops</span>
      </div>

      <!-- Menú de Módulos con nombres reales validados -->
      <nav class="space-y-1.5" id="nav-modulos">
        <button onclick="cambiarSeccion('mis-trabajos')" id="btn-mis-trabajos" class="nav-btn active">
          <span class="material-symbols-outlined text-lg">assignment_ind</span>
          <span>Mis Trabajos</span>
        </button>

        <button onclick="cambiarSeccion('ordenes')" id="btn-ordenes" class="nav-btn">
          <span class="material-symbols-outlined text-lg">rule</span>
          <span>Asignar Órdenes</span>
        </button>

        <button onclick="cambiarSeccion('informe-revision')" id="btn-informe-revision" class="nav-btn">
          <span class="material-symbols-outlined text-lg">rate_review</span>
          <span>Revisión Informes</span>
        </button>

        <button onclick="cambiarSeccion('todos-los-trabajos')" id="btn-todos-los-trabajos" class="nav-btn">
          <span class="material-symbols-outlined text-lg">folder_open</span>
          <span>Todos los Trabajos</span>
        </button>

        <button onclick="cambiarSeccion('planificacion')" id="btn-planificacion" class="nav-btn">
          <span class="material-symbols-outlined text-lg">calendar_month</span>
          <span>Planificación & Gantt</span>
        </button>

        <button onclick="cambiarSeccion('gastos-ingresos')" id="btn-gastos-ingresos" class="nav-btn">
          <span class="material-symbols-outlined text-lg">receipt_long</span>
          <span>Gastos e Ingresos</span>
        </button>

        <button onclick="cambiarSeccion('admin-usuarios')" id="btn-admin-usuarios" class="nav-btn">
          <span class="material-symbols-outlined text-lg">manage_accounts</span>
          <span>Privilegios Staff</span>
        </button>
      </nav>
    </div>

    <!-- Pie de Barra Lateral -->
    <div class="p-4 border-t border-white/5 space-y-2">
      <div class="flex items-center gap-2.5 px-2 text-xs text-slate-400">
        <span class="material-symbols-outlined text-base text-emerald-400">verified_user</span>
        <span class="truncate" id="txt-rol-badge">Acceso Verificado</span>
      </div>
    </div>
  </aside>

  <!-- 2. CONTENIDO PRINCIPAL CON IFRAME DE MÓDULOS -->
  <div class="flex-1 flex flex-col h-full overflow-hidden">
    
    <!-- Barra Superior -->
    <header class="h-14 bg-white border-b border-slate-200 px-6 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2 text-xs font-bold text-slate-500">
        <span id="txt-seccion-icono" class="material-symbols-outlined text-base text-brand">assignment_ind</span>
        <span id="txt-seccion-titulo" class="text-slate-800 text-sm">Mis Trabajos</span>
      </div>

      <div class="flex items-center gap-3">
        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-emerald-50 text-emerald-800 border border-emerald-200" id="badge-rol-header">
          ADMINISTRADOR
        </span>
        <span class="text-xs font-bold text-slate-700" id="txt-nombre-usuario">Christian Olivares</span>
        <button id="btn-logout" class="px-3 py-1 rounded-lg border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold transition flex items-center gap-1 cursor-pointer">
          <span class="material-symbols-outlined text-sm">logout</span> Salir
        </button>
      </div>
    </header>

    <!-- Contenedor del Iframe Dinámico -->
    <main class="flex-1 bg-slate-100/60 p-2 overflow-hidden relative">
      <iframe id="iframe-modulo" src="mis-trabajos.html" class="w-full h-full border-0 rounded-xl bg-transparent"></iframe>
    </main>

  </div>

  <script type="module">
    import { requireStaffAccess, wireLogoutButton } from "./js/portal-common.js";

    // Mapeo ajustado a los nombres físicos de archivos en la carpeta public
    const mapaRutas = {
      "mis-trabajos": { url: "mis-trabajos.html", titulo: "Mis Trabajos", icono: "assignment_ind" },
      "ordenes": { url: "ordenes.html", titulo: "Asignación de Órdenes", icono: "rule" },
      "informe-revision": { url: "informe-revision.html", titulo: "Revisión Informes", icono: "rate_review" },
      "todos-los-trabajos": { url: "todos-los-trabajos.html", titulo: "Todos los Trabajos en Terreno", icono: "folder_open" },
      "planificacion": { url: "planificacion.html", titulo: "Planificación & Carta Gantt", icono: "calendar_month" },
      "gastos-ingresos": { url: "gastos-ingresos.html", titulo: "Gestión de Gastos e Ingresos", icono: "receipt_long" },
      "admin-usuarios": { url: "admin-usuarios.html", titulo: "Administración y Privilegios Staff", icono: "manage_accounts" }
    };

    // Alias para compatibilidad con hashes anteriores (#asignar, #revision, etc.)
    const aliasMap = {
      "asignar": "ordenes",
      "revision": "informe-revision",
      "todos-trabajos": "todos-los-trabajos",
      "gantt": "planificacion",
      "finanzas": "gastos-ingresos",
      "staff": "admin-usuarios"
    };

    window.cambiarSeccion = function(key) {
      const realKey = aliasMap[key] || key;
      const config = mapaRutas[realKey] || mapaRutas["mis-trabajos"];
      const iframe = document.getElementById("iframe-modulo");
      const txtTitulo = document.getElementById("txt-seccion-titulo");
      const txtIcono = document.getElementById("txt-seccion-icono");

      if (iframe) iframe.src = config.url;
      if (txtTitulo) txtTitulo.textContent = config.titulo;
      if (txtIcono) txtIcono.textContent = config.icono;

      document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
      const btnActivo = document.getElementById(`btn-${realKey}`);
      if (btnActivo) btnActivo.classList.add("active");

      window.location.hash = realKey;
    };

    // Carga inicial según el hash
    const hashRaw = window.location.hash.replace("#", "") || "mis-trabajos";
    const hashInicial = aliasMap[hashRaw] || hashRaw;
    cambiarSeccion(hashInicial);

    requireStaffAccess((user, staffProfile) => {
      wireLogoutButton("btn-logout");

      const nombre = staffProfile?.nombres || staffProfile?.nombreCompleto || "Christian Olivares";
      const rol = (staffProfile?.rol || "ADMINISTRADOR").toUpperCase();

      document.getElementById("txt-nombre-usuario").textContent = nombre;
      document.getElementById("badge-rol-header").textContent = rol;
      document.getElementById("txt-rol-badge").textContent = `Rol: ${rol}`;

      if (rol === "OPERADOR") {
        const ocultar = ["btn-ordenes", "btn-informe-revision", "btn-gastos-ingresos", "btn-admin-usuarios"];
        ocultar.forEach(id => {
          const el = document.getElementById(id);
          if (el) el.style.display = "none";
        });
      }
    });
  </script>
</body>
</html>
