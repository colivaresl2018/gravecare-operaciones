<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraveCare - Mapa General de Operaciones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAthgIWiVPDuscljVjQRAX-vIeUYLbrSC0&libraries=places"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    #mapa { width: 100%; height: 500px; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #002d1a; color: white; padding: 12px; text-align: left; font-size: 0.75rem; text-transform: uppercase; }
    td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; }
    tr:hover { background: #f8faf8; }
  </style>
</head>
<body class="bg-[#f8faf8] p-6">

  <div class="max-w-7xl mx-auto space-y-6">

    <!-- KPI -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold text-slate-500 mb-1">Sepulturas / Órdenes Registradas</p>
        <p class="text-3xl font-bold text-[#002d1a]" id="kpi-sepulturas">0</p>
      </div>
      <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold text-slate-500 mb-1">Cementerios Activos</p>
        <p class="text-3xl font-bold text-[#002d1a]" id="kpi-cementerios">0</p>
      </div>
      <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold text-slate-500 mb-1">Ubicadas en Mapa</p>
        <p class="text-3xl font-bold text-[#002d1a]" id="kpi-geolocalizadas">0</p>
      </div>
    </div>

    <!-- Mapa -->
    <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-base font-bold text-[#002d1a]">Mapa Operativo de Sepulturas</h3>
        <span class="text-xs text-slate-500">Pines de todas las órdenes en terreno</span>
      </div>
      <div id="mapa"></div>
    </div>

    <!-- Filtros y Tabla -->
    <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-base font-bold text-slate-800">Directorio de Sepulturas</h3>
        <input type="search" id="filtro-busqueda" placeholder="Buscar difunto, cementerio o titular..." 
          class="px-3 py-2 text-xs border border-slate-300 rounded-lg w-72 focus:outline-none focus:border-[#002d1a]">
      </div>

      <div class="overflow-x-auto">
        <table>
          <thead>
            <tr>
              <th>Difunto</th>
              <th>Cementerio</th>
              <th>Cliente / Titular</th>
              <th>Operador</th>
              <th>Coordenadas GPS</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tabla-sepulturas">
            <tr><td colspan="6" class="text-center py-8 text-slate-400">Cargando sepulturas registradas...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAthgIWiVPDuscljVjQRAX-vIeUYLbrSC0",
      authDomain: "gravecare-2e8d2.firebaseapp.com",
      projectId: "gravecare-2e8d2",
      storageBucket: "gravecare-2e8d2.firebasestorage.app",
      messagingSenderId: "160012946248",
      appId: "1:160012946248:web:8c3e73100f1e92c485c17d"
    };

    const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
    const auth = getAuth(app);
    const db = getFirestore(app);

    let mapa = null;
    let marcadores = [];
    let sepulturasData = [];

    const COORDENADAS_CEMENTERIOS = {
      "cementerio general": { lat: -33.4158, lng: -70.6517 },
      "parque del recuerdo américo vespucio": { lat: -33.3762, lng: -70.6384 },
      "parque del recuerdo": { lat: -33.3762, lng: -70.6384 },
      "parque sendero maipú": { lat: -33.5186, lng: -70.7645 },
      "parque sendero": { lat: -33.5186, lng: -70.7645 },
      "parque el manantial": { lat: -33.5222, lng: -70.7410 },
      "parque del prado": { lat: -33.5678, lng: -70.5843 }
    };

    function inicializarMapa() {
      mapa = new google.maps.Map(document.getElementById('mapa'), {
        zoom: 11,
        center: { lat: -33.4489, lng: -70.6693 },
        mapTypeId: google.maps.MapTypeId.ROADMAP
      });
    }

    function resolverCoordenadas(ord) {
      if (ord.coordenadas?.latitude && ord.coordenadas?.longitude) {
        return { lat: ord.coordenadas.latitude, lng: ord.coordenadas.longitude };
      }
      if (ord.ubicacionSepultura?.coordenadas?.latitude && ord.ubicacionSepultura?.coordenadas?.longitude) {
        return { lat: ord.ubicacionSepultura.coordenadas.latitude, lng: ord.ubicacionSepultura.coordenadas.longitude };
      }
      const cemNombre = (ord.ubicacionSepultura?.cementerio || ord.cementerio || "").toLowerCase().trim();
      for (const [key, coords] of Object.entries(COORDENADAS_CEMENTERIOS)) {
        if (cemNombre.includes(key)) {
          return {
            lat: coords.lat + (Math.random() - 0.5) * 0.004,
            lng: coords.lng + (Math.random() - 0.5) * 0.004
          };
        }
      }
      return null;
    }

    async function cargarTodasLasSepulturas() {
      try {
        const snap = await getDocs(collection(db, "ordenes"));
        const lista = [];

        snap.forEach(docSnap => {
          const ord = docSnap.data();
          const difunto = ord.difunto?.nombreCompleto || ord.difunto?.nombre || ord.difunto || ord.nombreDifunto || "Sepultura Familiar";
          const cliente = ord.titular?.nombreCompleto || ord.titular?.nombre || ord.titular || ord.nombreTitular || ord.cliente || "Cliente";
          const cementerio = ord.ubicacionSepultura?.cementerio || ord.cementerio || "Parque del Recuerdo";
          const operador = ord.operadorAsignadoNombre || ord.operadorNombre || "Sin asignar";
          const estado = ord.estado || "Activa";

          lista.push({
            id: docSnap.id,
            difunto,
            cliente,
            cementerio,
            operador,
            estado,
            coordenadas: resolverCoordenadas(ord)
          });
        });

        sepulturasData = lista;
        actualizarDashboard(lista);
        actualizarMapa(lista);
        actualizarTabla(lista);
      } catch (e) {
        console.error("Error al cargar sepulturas:", e);
      }
    }

    function actualizarMapa(sepulturas) {
      if (!mapa) return;
      marcadores.forEach(m => m.setMap(null));
      marcadores = [];

      const bounds = new google.maps.LatLngBounds();
      let hasCoords = false;

      sepulturas.forEach(s => {
        if (s.coordenadas) {
          hasCoords = true;
          bounds.extend(s.coordenadas);

          const marcador = new google.maps.Marker({
            position: s.coordenadas,
            map: mapa,
            title: s.difunto,
            icon: `https://maps.google.com/mapfiles/ms/icons/green-dot.png`
          });

          const infoWindow = new google.maps.InfoWindow({
            content: `
              <div style="font-family:sans-serif; font-size:12px; padding:4px;">
                <strong style="color:#002d1a; font-size:13px;">${s.difunto}</strong><br>
                <span>${s.cementerio}</span><br>
                <span style="color:#64748b;">Cliente: ${s.cliente}</span><br>
                <span style="color:#047857; font-weight:bold;">Operador: ${s.operador}</span>
              </div>`
          });

          marcador.addListener('click', () => infoWindow.open(mapa, marcador));
          marcadores.push(marcador);
        }
      });

      if (hasCoords) {
        mapa.fitBounds(bounds);
      }
    }

    function actualizarTabla(sepulturas) {
      const q = (document.getElementById('filtro-busqueda')?.value || "").toLowerCase();
      const filtradas = sepulturas.filter(s => 
        s.difunto.toLowerCase().includes(q) ||
        s.cementerio.toLowerCase().includes(q) ||
        s.cliente.toLowerCase().includes(q)
      );

      const tbody = document.getElementById('tabla-sepulturas');
      if (filtradas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-slate-400">No se encontraron sepulturas</td></tr>';
        return;
      }

      tbody.innerHTML = filtradas.map(s => `
        <tr>
          <td class="font-bold text-slate-800">${s.difunto}</td>
          <td>${s.cementerio}</td>
          <td>${s.cliente}</td>
          <td class="font-medium text-emerald-800">${s.operador}</td>
          <td class="font-mono text-xs text-slate-500">${s.coordenadas ? s.coordenadas.lat.toFixed(4) + ', ' + s.coordenadas.lng.toFixed(4) : '<span class="text-amber-600 font-semibold">Sin GPS</span>'}</td>
          <td><span class="px-2 py-0.5 rounded text-xs font-bold bg-emerald-100 text-emerald-800">${s.estado}</span></td>
        </tr>
      `).join('');
    }

    function actualizarDashboard(sepulturas) {
      const cementeriosUnicos = new Set(sepulturas.map(s => s.cementerio));
      const geolocalizadas = sepulturas.filter(s => s.coordenadas).length;

      document.getElementById('kpi-sepulturas').textContent = sepulturas.length;
      document.getElementById('kpi-cementerios').textContent = cementeriosUnicos.size;
      document.getElementById('kpi-geolocalizadas').textContent = geolocalizadas;
    }

    document.getElementById('filtro-busqueda')?.addEventListener('input', () => actualizarTabla(sepulturasData));

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace("/login.html");
        return;
      }
      inicializarMapa();
      await cargarTodasLasSepulturas();
    });
  </script>
</body>
</html>
